name: Webhook - Docker Build

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Parse FLAT_CREDS
        if: github.event_name != 'pull_request'
        id: flat
        run: |
          echo "user=${FLAT_CREDS%%:*}" >> $GITHUB_OUTPUT
          echo "pass=${FLAT_CREDS#*:}" >> $GITHUB_OUTPUT
        env:
          FLAT_CREDS: ${{ secrets.FLAT_CREDS }}

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.FLAT_REGISTRY }}
          username: ${{ steps.flat.outputs.user }}
          password: ${{ steps.flat.outputs.pass }}

      - name: Parse latest webhook version
        id: webhook_info
        env:
          DOCKERHUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          WEBHOOK_VERSION=$(git ls-remote --tags https://github.com/adnanh/webhook.git | sed 's;.*/;;g' | \
             grep -E '^[0-9]+(\.[0-9]+){2}$' | \
             sort -rV | head -n 1)

          CURRENT_VERSION=$(skopeo list-tags --creds "${DOCKERHUB_CREDS}" docker://${{ secrets.DOCKERHUB_USERNAME }}/webhook | \
            jq -r '.Tags[]' | \
            grep -E '^[0-9]+(\.[0-9]+){2}$' | \
            sort -rV | head -n 1)

          ENABLE_BUILD=0
          if [[ ${CURRENT_VERSION} != ${WEBHOOK_VERSION} ]]; then
            ENABLE_BUILD=1
          fi

          echo "ENABLE_BUILD=${ENABLE_BUILD}" >> $GITHUB_OUTPUT
          echo "WEBHOOK_VERSION=${WEBHOOK_VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        if: steps.webhook_info.outputs.ENABLE_BUILD == '1'
        uses: docker/build-push-action@v7
        with:
          context: webhook
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webhook:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webhook:${{ steps.webhook_info.outputs.WEBHOOK_VERSION }}
            ghcr.io/${{ github.actor }}/webhook:latest
            ghcr.io/${{ github.actor }}/webhook:${{ steps.webhook_info.outputs.WEBHOOK_VERSION }}
            ${{ secrets.FLAT_REGISTRY }}/osc-org/webhook:latest
            ${{ secrets.FLAT_REGISTRY }}/osc-org/webhook:${{ steps.webhook_info.outputs.WEBHOOK_VERSION }}
          build-args: |
            WEBHOOK_VERSION=${{ steps.webhook_info.outputs.WEBHOOK_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
