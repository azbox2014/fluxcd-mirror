name: ZeroTier - Build Image

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "ZeroTierOne VERSION (e.g. 1.14.0)"
        required: false

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 3 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zerotier-one

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone ZeroTierOne
        run: |
          git clone https://github.com/zerotier/ZeroTierOne.git
          VERSION=
          if [ -z "${{ inputs.VERSION }}" ]; then
            cd ZeroTierOne
            VERSION=$(git tag | grep -E '^[0-9]+(\.[0-9]+){2}$' | sort -rV | head -n 1)
          else
            VERSION=${{ inputs.VERSION }}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Parse FLAT_CREDS
        if: github.event_name != 'pull_request'
        id: flat
        run: |
          echo "user=${FLAT_CREDS%%:*}" >> $GITHUB_OUTPUT
          echo "pass=${FLAT_CREDS#*:}" >> $GITHUB_OUTPUT
        env:
          FLAT_CREDS: ${{ secrets.FLAT_CREDS }}

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.FLAT_REGISTRY }}
          username: ${{ steps.flat.outputs.user }}
          password: ${{ steps.flat.outputs.pass }}

      - name: Parse QCR_CREDS
        if: github.event_name != 'pull_request'
        id: qcr
        run: |
          echo "user=${QCR_CREDS%%:*}" >> $GITHUB_OUTPUT
          echo "pass=${QCR_CREDS#*:}" >> $GITHUB_OUTPUT
        env:
          QCR_CREDS: ${{ secrets.QCR_CREDS }}

      - name: Log in to QCR Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.QCR_REGISTRY }}
          username: ${{ steps.qcr.outputs.user }}
          password: ${{ steps.qcr.outputs.pass }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ZeroTierOne
          file: ZeroTierOne/Dockerfile.release
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/zerotier-one:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/zerotier-one:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/zerotier-one:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/zerotier-one:${{ env.VERSION }}
            ${{ secrets.FLAT_REGISTRY }}/osc-org/zerotier-one:latest
            ${{ secrets.FLAT_REGISTRY }}/osc-org/zerotier-one:${{ env.VERSION }}
            ${{ secrets.QCR_REGISTRY }}/osc-org/zerotier-one:latest
            ${{ secrets.QCR_REGISTRY }}/osc-org/zerotier-one:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
