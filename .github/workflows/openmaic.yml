name: OpenMAIC - Build Image

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

env:
  SOURCE_REPO: https://github.com/THU-MAIC/OpenMAIC
  TAG_PATTERN: ^v[0-9]+(\.[0-9]+){2}$

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine VERSION
        id: version
        run: |
          echo "🔍 检查 OpenMAIC 仓库的新 tag..."
          git ls-remote --tags ${SOURCE_REPO} | awk '{print $2}' | sed 's|refs/tags/||' | sort -V > remote_tags.txt

          echo "📋 远程仓库的所有 tag:"
          cat remote_tags.txt

          grep -E "${TAG_PATTERN}" remote_tags.txt > valid_tags.txt || true

          echo "📋 符合规则的 tag (^v[0-9]+(\.[0-9]+){2}$):"
          cat valid_tags.txt || echo "无"

          if [ ! -s valid_tags.txt ]; then
            echo "⚠️ 没有找到符合规则的 tag，跳过构建"
            exit 1
          fi

          VERSION=$(tail -1 valid_tags.txt)
          echo "📌 最新有效 tag: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "📌 构建版本: ${VERSION}"

      - name: Clone OpenMAIC source
        run: |
          echo "📦 克隆 OpenMAIC 源代码..."
          git clone --branch ${{ env.VERSION }} --depth 1 ${SOURCE_REPO} openmaic-source
          echo "📂 源代码目录:"
          ls -la openmaic-source/

      # 上游 Dockerfile 未声明 NEXT_PUBLIC_PRO_WORKBENCH_ENABLED（ARG 列表遗漏）。
      # Docker 会静默丢弃未声明的 build-arg，导致该 flag 在编译期被内联为 undefined：
      #   lib/workbench/entry-gate.ts → isWorkbenchEntryEnabled() 恒为 false
      #   → /workspace 重定向到 /，首页 Pro 入口消失
      # 此处在构建前补声明。上游修复后可删除本 step。
      - name: Patch Dockerfile (upstream missing ARG)
        run: |
          cd openmaic-source

          if grep -q 'ARG NEXT_PUBLIC_PRO_WORKBENCH_ENABLED' Dockerfile; then
            echo "✅ 上游已修复，无需 patch（可移除本 step）"
            exit 0
          fi

          if ! grep -q '^RUN pnpm build$' Dockerfile; then
            echo "::error::Dockerfile 结构变更，找不到锚点 'RUN pnpm build'，patch 失败"
            exit 1
          fi

          sed -i '/^RUN pnpm build$/i ARG NEXT_PUBLIC_PRO_WORKBENCH_ENABLED\nENV NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=$NEXT_PUBLIC_PRO_WORKBENCH_ENABLED\n' Dockerfile

          echo "✅ 已注入 ARG/ENV，核对:"
          grep -n 'PRO_WORKBENCH' Dockerfile

      # Next.js standalone 输出追踪是静态扫描，跟不到 sharp 的 .node 文件在运行期
      # dlopen("libvips-cpp.so.X") 这一步，导致 @img/sharp-libvips-* 的 .so 二进制
      # 未被复制进 standalone 输出（目录被建了但文件没进去）。
      # 症状: ERR_DLOPEN_FAILED: Error loading shared library libvips-cpp.so.8.18.6
      # 后果: instrumentation.ts 的 agent runtime 启动链整体中断，agent runner 和
      #       material extraction runner 均不启动。
      # 此处在 builder 阶段的 pnpm build 之后把 .so 手动补进 standalone 树。
      # 上游修复（如改用 outputFileTracingIncludes 或更新 Dockerfile COPY 范围）
      # 后可删除本 step。
      - name: Patch Dockerfile (sharp libvips .so not traced)
        run: |
          cd openmaic-source

          if grep -q 'sharp-libvips' Dockerfile; then
            echo "✅ 已 patch，跳过（幂等）"
            exit 0
          fi

          if ! grep -q '^RUN pnpm build$' Dockerfile; then
            echo "::error::Dockerfile 结构变更，找不到锚点 'RUN pnpm build'，patch 失败"
            exit 1
          fi

          cat > /tmp/libvips-fix.txt <<'DOCKERFRAG'

          RUN set -e; \
              found=0; \
              for lib in node_modules/.pnpm/@img+sharp-libvips-*/node_modules/@img/*/lib; do \
                [ -d "$lib" ] || continue; \
                target=".next/standalone/$lib"; \
                mkdir -p "$target"; \
                cp -a "$lib"/. "$target"/; \
                found=1; \
                echo "  已补入: $lib"; \
              done; \
              if [ "$found" = "0" ]; then \
                echo "未找到任何 sharp-libvips 包，依赖结构可能已变更"; \
                exit 1; \
              fi; \
              echo "libvips .so 已补入 standalone:"; \
              find .next/standalone -name "libvips*.so*" -exec ls -la {} \;
          DOCKERFRAG

          sed -i 's/^          //' /tmp/libvips-fix.txt
          sed -i '/^RUN pnpm build$/r /tmp/libvips-fix.txt' Dockerfile

          echo "✅ 已注入 libvips 修复，核对:"
          sed -n '/^RUN pnpm build$/,/^# ---- Stage 4/p' Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Parse FLAT_CREDS
        id: flat
        run: |
          echo "user=${FLAT_CREDS%%:*}" >> $GITHUB_OUTPUT
          echo "pass=${FLAT_CREDS#*:}" >> $GITHUB_OUTPUT
        env:
          FLAT_CREDS: ${{ secrets.FLAT_CREDS }}

      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.FLAT_REGISTRY }}
          username: ${{ steps.flat.outputs.user }}
          password: ${{ steps.flat.outputs.pass }}

      - name: Parse QCR_CREDS
        id: qcr
        run: |
          echo "user=${QCR_CREDS%%:*}" >> $GITHUB_OUTPUT
          echo "pass=${QCR_CREDS#*:}" >> $GITHUB_OUTPUT
        env:
          QCR_CREDS: ${{ secrets.QCR_CREDS }}

      - name: Log in to QCR Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.QCR_REGISTRY }}
          username: ${{ steps.qcr.outputs.user }}
          password: ${{ steps.qcr.outputs.pass }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: openmaic-source
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_PERSISTENCE=1
            NEXT_PUBLIC_PERSISTENCE_TOKEN=openmaic-internal
            NEXT_PUBLIC_PRO_WORKBENCH_ENABLED=true
            NEXT_PUBLIC_MAIC_EDITOR_ENABLED=true
            NEXT_PUBLIC_MAIC_EDITOR_RENDERER_ENABLED=true
            NEXT_PUBLIC_MAIC_PLAYBACK_RENDERER_ENABLED=true
            NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=true
            NEXT_PUBLIC_ENABLE_PPTX_IMPORT=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openmaic:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/openmaic:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openmaic:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openmaic:${{ env.VERSION }}
            ${{ secrets.FLAT_REGISTRY }}/osc-org/openmaic:latest
            ${{ secrets.FLAT_REGISTRY }}/osc-org/openmaic:${{ env.VERSION }}
            ${{ secrets.QCR_REGISTRY }}/osc-org/openmaic:latest
            ${{ secrets.QCR_REGISTRY }}/osc-org/openmaic:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Clean up
        if: always()
        run: rm -rf openmaic-source
