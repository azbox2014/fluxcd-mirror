name: Code-Server - Build Image
run-name: Code-Server - ${{ github.ref_name }}

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read
  packages: write

env:
  PUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/code-server
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/code-server
  ACR_IMAGE: ${{ secrets.FLAT_REGISTRY }}/osc-org/code-server
  QCR_IMAGE: ${{ secrets.QCR_REGISTRY }}/osc-org/code-server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve upstream image version
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION=$(
            skopeo list-tags docker://docker.io/linuxserver/code-server \
              | jq -r '.Tags[]' \
              | grep '^version-[0-9]' \
              | sort -V \
              | tail -n1
          )

          if [[ -z "${BASE_VERSION}" ]]; then
            echo "Failed to resolve upstream version"
            exit 1
          fi

          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV

          echo "Upstream version: ${BASE_VERSION}"

      - name: Resolve image version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${BASE_VERSION#version-}

          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          echo "Image version: ${VERSION}"

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Parse FLAT_CREDS
        if: github.event_name != 'pull_request'
        id: flat
        run: |
          echo "user=${FLAT_CREDS%%:*}" >> $GITHUB_OUTPUT
          echo "pass=${FLAT_CREDS#*:}" >> $GITHUB_OUTPUT
        env:
          FLAT_CREDS: ${{ secrets.FLAT_CREDS }}

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.FLAT_REGISTRY }}
          username: ${{ steps.flat.outputs.user }}
          password: ${{ steps.flat.outputs.pass }}

      - name: Parse QCR_CREDS
        if: github.event_name != 'pull_request'
        id: qcr
        run: |
          echo "user=${QCR_CREDS%%:*}" >> $GITHUB_OUTPUT
          echo "pass=${QCR_CREDS#*:}" >> $GITHUB_OUTPUT
        env:
          QCR_CREDS: ${{ secrets.QCR_CREDS }}

      - name: Log in to QCR Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.QCR_REGISTRY }}
          username: ${{ steps.qcr.outputs.user }}
          password: ${{ steps.qcr.outputs.pass }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: code-server
          file: code-server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.PUB_IMAGE }}:${{ env.VERSION }}
            ${{ env.PUB_IMAGE }}:latest
          build-args: |
            BASE_VERSION=${{ env.BASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push to ACR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: code-server
          file: code-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ACR_IMAGE }}:${{ env.VERSION }}
            ${{ env.ACR_IMAGE }}:latest
          build-args: |
            BASE_VERSION=${{ env.BASE_VERSION }}
          cache-from: type=gha
          provenance: false
          sbom: false

